<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoxbodyDash 2.0</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/gauges.css" />
</head>
<body>
  <div id="appShell">
    <div id="backgroundLayer"></div>
    <div id="bezelLayer"></div>

    <header id="topStatusBar">
      <div id="topLeftStatus">
        <span id="brandMark">FOXBODY DASH</span>
        <span id="driveMode">DEMO MODE</span>
      </div>
      <div id="topRightStatus">
        <span id="clockDisplay">12:00 PM</span>
        <span id="outsideTemp">74°F</span>
      </div>
    </header>

    <main id="dashboardSurface">
      <section id="indicatorLayer" aria-label="status indicators">
        <div id="leftTurnIndicator" class="indicatorSlot">◀</div>
        <div id="highBeamIndicator" class="indicatorSlot">HB</div>
        <div id="rightTurnIndicator" class="indicatorSlot">▶</div>
      </section>

      <section id="leftGaugeArea" aria-label="tachometer area">
        <svg id="tachometerGauge" viewBox="0 0 400 400" role="img" aria-label="Tachometer"></svg>
      </section>

      <section id="centerCluster" aria-label="vehicle information">
        <div class="clusterCard clusterTopRow">
          <div class="clusterLabel">GEAR</div>
          <div id="gearRow">
            <span id="gearDisplay">3</span>
            <span id="gearType">N</span>
          </div>
        </div>

        <div class="clusterCard">
          <div class="clusterLabel">ODOMETER</div>
          <div id="odometer">184,232 MI</div>
        </div>

        <div class="clusterDivider"></div>

        <div class="clusterCard">
          <div class="clusterLabel">TRIP A</div>
          <div id="tripA">123.4 MI</div>
        </div>

        <div class="clusterDivider"></div>

        <div class="clusterCard">
          <div class="clusterLabel">CRUISE</div>
          <div id="cruiseStatus">OFF</div>
        </div>
      </section>

      <section id="rightGaugeArea" aria-label="speedometer area">
        <svg id="speedometerGauge" viewBox="0 0 400 400" role="img" aria-label="Speedometer"></svg>
      </section>

      <section id="auxGaugeRow" aria-label="auxiliary gauges">
        <div class="miniGauge" id="fuelGauge"></div>
        <div class="miniGauge" id="coolantGauge"></div>
        <div class="miniGauge" id="oilGauge"></div>
        <div class="miniGauge" id="batteryGauge"></div>
      </section>

      <section id="liveRibbon" aria-label="live vehicle data">
        <span>Oil 62 PSI</span>
        <span>AFR 14.7</span>
        <span>MAP 34 kPa</span>
        <span>Battery 14.2V</span>
        <span>Fuel 41 PSI</span>
        <span>ECT 188°</span>
      </section>

      <section id="statusBar" aria-label="alerts"></section>
    </main>

    <footer id="bottomNav" aria-label="navigation">
      <button type="button">Home</button>
      <button type="button">Vehicle</button>
      <button type="button">Music</button>
      <button type="button">Themes</button>
      <button type="button">Settings</button>
    </footer>
  </div>

  <script src="components/gaugeFace.js"></script>
  <script src="components/gauge.js"></script>
  <script src="components/miniGauge.js"></script>
  <script src="components/miniGaugeFace.js"></script>
  <script src="components/statusbar.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
