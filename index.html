<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FoxbodyDash Studio</title>
  <link rel="stylesheet" href="css/app.css?v=studio9" />
  <link rel="stylesheet" href="css/assembly.css?v=studio9" />
  <link rel="stylesheet" href="css/studio5.css?v=studio9" />
  <link rel="stylesheet" href="css/nav-mode.css?v=1" />
</head>
<body>
  <div id="foxApp">
    <header id="appBar">
      <div class="brand"><strong>FOXBODY DASH</strong><span id="modeBadge">RUN</span></div>
      <div class="appActions">
        <button id="vehiclePageButton" type="button">VEHICLE</button>
        <button id="editModeButton" type="button">EDIT</button>
        <button id="panelToggleButton" type="button">PANELS</button>
        <button id="buildGaugeButton" type="button">BUILD GAUGE</button>
        <button id="saveLayoutButton" type="button">SAVE</button>
      </div>
    </header>

    <main id="studio">
      <aside id="libraryPanel" class="studioPanel">
        <div class="panelHeading panelHeadingRow"><span>ADD / DESIGN</span><button id="collapseLibrary" class="collapsePanelButton" type="button">◀</button></div>
        <div id="libraryTabs" class="tabGrid">
          <button class="tab active" data-library="widgets" type="button">WIDGETS</button>
          <button class="tab" data-library="shapes" type="button">SHAPES</button>
          <button class="tab" data-library="gaugeParts" type="button">GAUGE PARTS</button>
          <button class="tab" data-library="icons" type="button">ALERTS</button>
          <button class="tab" data-library="indicators" type="button">INDICATORS</button>
          <button class="tab" data-library="materials" type="button">MATERIALS</button>
          <button class="tab" data-library="images" type="button">IMAGES</button>
          <button class="tab wideTab" data-library="canvas" type="button">CANVAS BACKGROUND</button>
        </div>
        <div id="libraryItems"></div>
      </aside>

      <section id="canvasWrap"><div id="dashCanvas" aria-label="Dashboard design canvas"></div></section>

      <aside id="inspectorPanel" class="studioPanel">
        <div class="panelHeading panelHeadingRow"><span>PROPERTIES</span><button id="collapseInspector" class="collapsePanelButton" type="button">▶</button></div>
        <div id="nothingSelected">Select an element.</div>
        <form id="inspector" hidden>
          <label>Data / Gauge Type<select id="fieldData"></select></label>
          <label>Name<input id="fieldName" type="text" /></label>
          <div class="twoCol">
            <label>X<input id="fieldX" type="number" step="0.1" /></label>
            <label>Y<input id="fieldY" type="number" step="0.1" /></label>
            <label>W<input id="fieldW" type="number" step="0.1" min="1" /></label>
            <label>H<input id="fieldH" type="number" step="0.1" min="1" /></label>
            <label>Rotate<input id="fieldRotate" type="number" step="1" /></label>
            <label>Opacity<input id="fieldOpacity" type="number" min="0" max="1" step="0.05" /></label>
          </div>
          <label id="materialField">Material<select id="fieldMaterial"></select></label>
          <label id="scaleModeField">Scale mode<select id="fieldScaleMode"><option value="stretch">Stretch</option><option value="contain">Contain</option><option value="cover">Cover</option><option value="tile">Tile</option></select></label>

          <div id="textStyleFields" class="propertySection" hidden>
            <div class="propertySectionTitle">TEXT STYLE</div>
            <label>Text<input id="fieldTextContent" type="text" /></label>
            <label>Font<select id="fieldTextFont"><option value="Arial, Helvetica, sans-serif">Arial</option><option value="Arial Black, Arial, sans-serif">Arial Black</option><option value="Impact, Haettenschweiler, sans-serif">Impact</option><option value="Verdana, Geneva, sans-serif">Verdana</option><option value="Trebuchet MS, sans-serif">Trebuchet</option><option value="Georgia, serif">Georgia</option><option value="Courier New, monospace">Courier New</option></select></label>
            <div class="colorGrid">
              <label>Letters<input id="fieldTextColor" type="color" value="#ffffff" /></label>
              <label>Weight<select id="fieldTextWeight"><option value="400">Regular</option><option value="600">Semi Bold</option><option value="700">Bold</option><option value="900">Heavy</option></select></label>
            </div>
            <div class="twoCol">
              <label>Spacing<input id="fieldTextSpacing" type="number" step="0.5" min="-5" max="30" /></label>
              <label>Align<select id="fieldTextAlign"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select></label>
            </div>
          </div>

          <div id="gaugeStyleFields" class="propertySection" hidden>
            <div class="propertySectionTitle">GAUGE STYLE</div>
            <label>Gauge shape<select id="fieldGaugeShape"><option value="ellipse">Ellipse / Round</option><option value="rectangle">Rectangle</option><option value="rounded">Rounded rectangle</option></select></label>
            <label>Needle design<select id="fieldNeedleStyle"><option value="classic">Classic</option><option value="tapered">Tapered</option><option value="wedge">Modern Wedge</option><option value="race">Race</option><option value="slim">Slim Pointer</option></select></label>
            <label class="check"><input id="fieldFaceTransparent" type="checkbox" /> Transparent gauge face</label>
            <div class="colorGrid">
              <label>Face<input id="fieldFaceColor" type="color" value="#080808" /></label>
              <label>Ticks<input id="fieldTickColor" type="color" value="#eeeeee" /></label>
              <label>Needle<input id="fieldNeedleColor" type="color" value="#e52b2b" /></label>
              <label>Hub<input id="fieldHubColor" type="color" value="#111111" /></label>
            </div>
            <div class="propertySectionTitle">TICK SIZE</div>
            <div class="twoCol">
              <button id="tickSizeDown" type="button">− SMALLER</button>
              <button id="tickSizeUp" type="button">+ LARGER</button>
            </div>
            <div id="tickSizeValue">100%</div>
          </div>

          <label class="check"><input id="fieldTransparent" type="checkbox" /> Transparent surface</label>
          <label class="check"><input id="fieldVisible" type="checkbox" /> Visible</label>
          <label class="check"><input id="fieldAspect" type="checkbox" /> Lock aspect ratio</label>
          <div class="inspectorButtons">
            <button id="duplicateElement" type="button">DUPLICATE</button>
            <button id="bringForward" type="button">FRONT</button>
            <button id="sendBackward" type="button">BACK</button>
            <button id="deleteElement" class="danger" type="button">DELETE</button>
          </div>
        </form>
      </aside>
    </main>

    <footer id="statusBar"><span id="appStatus">READY</span><span id="selectionStatus">NO SELECTION</span><span>1024 × 600</span></footer>
  </div>

  <div id="fatalError" hidden></div>
  <script src="js/app/catalog.js?v=studio9"></script>
  <script src="js/app/gaugeRenderer.js?v=studio9"></script>
  <script src="js/app/main.js?v=studio9"></script>
  <script src="js/app/indicatorLibrary.js?v=studio9"></script>
  <script src="js/app/navMode.js?v=1"></script>
</body>
</html>
