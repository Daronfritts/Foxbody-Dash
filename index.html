<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foxbody Dash</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/gauges.css" />
  <style>
    body {
      margin: 0;
      background: #000;
    }
  </style>
</head>
<body>
  <div id="dashboard">
    <header id="topBar">
      <div id="leftIndicators">
        <div class="indicator placeholder" aria-hidden="true"></div>
        <div class="indicator placeholder" aria-hidden="true"></div>
      </div>
      <div id="clusterLogo">
        <div id="foxbodyTitle">FOXBODY GT</div>
        <img id="mustangLogo" src="assets/images/mustangWhite.svg" alt="Mustang" />
      </div>
      <div id="rightIndicators">
        <div class="indicator placeholder" aria-hidden="true"></div>
      </div>
    </header>

    <main id="mainView">
      <section id="cluster">
        <div class="clusterScrew screwTL"></div>
        <div class="clusterScrew screwTR"></div>
        <div class="clusterScrew screwBL"></div>
        <div class="clusterScrew screwBR"></div>

        <svg id="tach" viewBox="0 0 430 430" aria-label="Tachometer"></svg>
        <section id="driverInfoCenter">
          <div id="clusterHeader">
            <div id="clockDisplay">12:00 PM</div>
            <div id="outsideTemp">74°F</div>
          </div>
          <div id="gearRow">
            <span class="label">GEAR</span>
            <span id="gearDisplay">3</span>
            <span id="gearType">N</span>
          </div>
          <div class="clusterDivider"></div>
          <div class="clusterInfo">
            <div class="infoLabel">ODOMETER</div>
            <div id="odometer">184,232 MI</div>
          </div>
          <div class="clusterDivider"></div>
          <div class="clusterInfo">
            <div class="infoLabel">TRIP A</div>
            <div id="tripA">123.4 MI</div>
          </div>
          <div class="clusterDivider"></div>
          <div id="cruiseStatus">READY</div>
        </section>
        <svg id="speed" viewBox="0 0 430 430" aria-label="Speedometer"></svg>

        <div id="fuelGauge" class="smallGauge"></div>
        <div id="oilGauge" class="smallGauge"></div>
        <div id="coolantGauge" class="smallGauge"></div>
        <div id="batteryGauge" class="smallGauge"></div>
      </section>

      <section id="liveRibbon">
        <span>Oil 62 PSI</span>
        <span>AFR 14.7</span>
        <span>MAP 34 kPa</span>
        <span>Battery 14.2V</span>
        <span>Fuel 41 PSI</span>
        <span>ECT 188°</span>
      </section>

      <section id="statusBar"></section>
      <section id="systemBar">
        <div id="statusIcon">●</div>
        <div id="statusText">READY</div>
      </section>
    </main>

    <footer id="bottomNav">
      <button class="active">Home</button>
      <button>Vehicle</button>
      <button>Music</button>
      <button>Themes</button>
      <button>Settings</button>
    </footer>
  </div>
</body>
</html>
