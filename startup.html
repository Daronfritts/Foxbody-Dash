<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Foxbody Dash Startup</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      cursor: none;
    }

    #startupScreen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      opacity: 1;
      transition: opacity 180ms ease-out;
    }

    #startupScreen.fadeOut {
      opacity: 0;
    }

    #startupVideo {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #000;
    }
  </style>
</head>
<body>
  <div id="startupScreen">
    <video
      id="startupVideo"
      src="assets/video/foxbody_dash_startup_v6_full_blue.mp4"
      autoplay
      muted
      playsinline
      preload="auto"
      disablepictureinpicture
    ></video>
  </div>

  <script>
    (() => {
      const screen = document.getElementById('startupScreen');
      const video = document.getElementById('startupVideo');
      let leaving = false;

      function openDash() {
        if (leaving) return;
        leaving = true;
        screen.classList.add('fadeOut');
        window.setTimeout(() => {
          window.location.replace('index.html');
        }, 180);
      }

      video.addEventListener('ended', openDash, { once: true });
      video.addEventListener('error', openDash, { once: true });

      const playAttempt = video.play();
      if (playAttempt && typeof playAttempt.catch === 'function') {
        playAttempt.catch(openDash);
      }

      // Fail-safe: never leave the dash stuck on the startup screen.
      window.setTimeout(openDash, 8000);
    })();
  </script>
</body>
</html>
