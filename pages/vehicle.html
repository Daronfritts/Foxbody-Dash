<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vehicle</title>
    <link rel="stylesheet" href="../css/vehicle.css" />
</head>
<body>
    <main id="vehiclePage">
        <header id="vehicleHeader">
            <button id="vehicleHome" type="button">HOME</button>
            <div>
                <h1>FOXBODY VEHICLE</h1>
                <p id="vehicleViewName">FRONT VIEW</p>
            </div>
            <div class="headerSpacer"></div>
        </header>

        <section id="vehicleWorkspace">
            <div id="vehicleView">
                <object
                    id="vehicleObject"
                    data="../assets/vehicle/exterior/frontView.svg"
                    type="image/svg+xml"
                    aria-label="Vehicle view">
                </object>
            </div>

            <aside id="vehicleInfo">
                <h2>Vehicle</h2>
                <p>Select a highlighted component for information.</p>
            </aside>
        </section>

        <nav id="vehicleButtons" aria-label="Vehicle views">
            <button class="vehicleViewButton active" type="button" data-view="front">FRONT</button>
            <button class="vehicleViewButton" type="button" data-view="driver">DRIVER</button>
            <button class="vehicleViewButton" type="button" data-view="passenger">PASSENGER</button>
            <button class="vehicleViewButton" type="button" data-view="top">TOP</button>
            <button class="vehicleViewButton" type="button" data-view="engine">ENGINE</button>
        </nav>
    </main>

    <script src="../js/vehicle.js"></script>
</body>
</html>
